name: Judge

# Suggests links between notes and flags risks from past lessons, for notes
# that don't have a judgment yet. Runs when notes are pushed.
on:
  push:
    branches: [main]
    paths:
      - "data/events/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: judge
  cancel-in-progress: false

jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: judge

      - name: Build judge
        run: cargo build --profile tool -p judge --locked

      - name: Judge new notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
        run: target/tool/judge notes --data data

      - name: Commit judgments
        run: |
          .github/scripts/commit-data.sh "judge: links and risks for new notes" data/judgments
