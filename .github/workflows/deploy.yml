name: Deploy

# Rebuilds the app and publishes it to GitHub Pages. Commits that only touch
# data/ (notes, judgments, digests) don't trigger a rebuild.
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust (version from rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: trunk@0.22.1

      - name: Test core
        run: cargo test -p aarambh-core --locked

      - name: Build
        run: |
          cargo fetch --locked
          trunk build --release

      - name: Check artifact
        run: |
          rm -f dist/.trunk-lock
          test ! -e dist/data || { echo "dist/ must not contain data/"; exit 1; }
          wasm=$(ls dist/*.wasm)
          raw=$(stat -c%s "$wasm")
          gz=$(gzip -9c "$wasm" | wc -c)
          echo "wasm: $((raw / 1024)) KB raw, $((gz / 1024)) KB gzipped" >> "$GITHUB_STEP_SUMMARY"
          test "$gz" -le 153600 || { echo "wasm is over the 150 KB gzipped budget"; exit 1; }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
