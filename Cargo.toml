[workspace]
resolver = "3"
members = ["crates/core", "crates/web", "crates/judge"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
aarambh-core = { path = "crates/core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
ulid = { version = "=3.0.0", default-features = false }
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
