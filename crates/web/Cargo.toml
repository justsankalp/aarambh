[package]
name = "aarambh-web"
description = "The aarambh notebook PWA (Leptos, client-side rendered)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aarambh-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "=0.8.22", features = ["csr"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = { version = "=0.3.107", features = [
    "AbortController",
    "AbortSignal",
    "Document",
    "DomTokenList",
    "FocusOptions",
    "HtmlDivElement",
    "HtmlTextAreaElement",
    "ScrollBehavior",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "CssStyleDeclaration",
    "VisualViewport",
    "EventTarget",
    "VisibilityState",
    "Element",
    "Headers",
    "HtmlElement",
    "Location",
    "MediaQueryList",
    "Navigator",
    "Clipboard",
    "Request",
    "RequestCache",
    "RequestInit",
    "RequestMode",
    "Response",
    "Storage",
    "Window",
] }
console_error_panic_hook = "=0.1.7"
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
base64 = "=0.23.1"
idb = { version = "=0.6.5", default-features = false, features = ["futures"] }
