[package]
name = "judge"
description = "Native CLI run by GitHub Actions: judges new notes and writes digests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "judge"
path = "src/main.rs"

[dependencies]
aarambh-core.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "http2"] }
tokio = { version = "=1.54.1", features = ["macros", "rt", "time"] }

[dev-dependencies]
wiremock = "=0.6.5"
